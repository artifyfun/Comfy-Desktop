appId: com.artifyfun.desktop
productName: Artify
directories:
  buildResources: resources
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!eslint.config.ts'
  - '!{.eslintcache,.prettierrc.json,README.md,AGENTS.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.env,.env.*,.npmrc}'
  - '!docs/*'
  - '!out/**/*.map'
  - '!reference/*'
  - '!**/*.wsb'
  # ===== 排除非运行时内容，避免 app.asar 体积膨胀导致 Electron 无法加载 =====
  # .npmrc 将 pnpm store 指向项目内 .pnpm-store（~1.2GB / 6 万文件），
  # 不排除会被整个打进 asar，asar 膨胀到 1.5GB 后主进程加载失败（打包安装后白屏/无日志）。
  - '!.pnpm-store/**'
  # bootstrap-python 已由 win/mac/linux 的 extraResources 复制到 resources/，asar 内不需要
  - '!bootstrap-python/**'
  # 前端源码已由 build:frontend 产出到 src/main/artifylab/public/frontend（extraResources）
  - '!packages/**'
  # 开发期产物与工具文件
  - '!.codegraph/**'
  - '!e2e/**'
  - '!**/*.log'
  - '!CLAUDE.md'
  - '!release-cache.json'
  - '!todesktop.json'
  - '!TESTING.md'
  - '!linux-dev.sh'
  - '!vitest.*.ts'
  - '!playwright.config.ts'
  - '!tsconfig.e2e.json'
  - '!tsconfig.test.json'
  - '!tsconfig.vitest-integration.json'
  - '!tsconfig.comfy-desktop-bridge-types.json'
extraResources:
  - from: lib
    to: lib
  # artifylab 前端产物（artifylab-frontend 的 build:copy 写入源码目录，
  # server.ts 的 getFrontendPath() 在生产环境从这里读取）
  - from: src/main/artifylab/public/frontend
    to: frontend
  # 构建应用（Codex agent）的设计体系指引：ui-ux-pro-max 设计智能 + minimalist-ui 极简反 slop 协议。
  # agentDriver 在 build 目录里把它拷给 Codex 读取，替代原本固化的提示词、提升出图质感。
  - from: src/main/artifylab/public/design-system
    to: design-system
  # 工作台 skill（渐进式加载）：workbench service 每次会话创建时把这里的
  # <name>/SKILL.md 部署进 codex 临时 CODEX_HOME/skills/，长规则按需读取。
  - from: src/main/artifylab/public/workbench-skills
    to: workbench-skills
  # codex 原生二进制（scripts/copy-codex-bin.mjs 从 @openai/codex-<platform> 平台包拷入）。
  # agentDriver 通过 Codex SDK 的 codexPathOverride 直接 spawn 内置 exe —— 用户无需安装 codex CLI / node，
  # 只填 DeepSeek key 即可构建应用。
  - from: src/main/artifylab/public/codex-bin
    to: codex-bin
# Skip the node-gyp rebuild pass: node-pty (the only native dependency)
# ships N-API prebuilds for win32-x64 that are ABI-agnostic across
# Electron versions, and its winpty git-submodule sources are not fully
# present in the npm package, so a forced rebuild fails locally.
npmRebuild: false
asarUnpack:
  - node_modules/7zip-bin/**/*
  - node_modules/node-pty/**/*
  # @ngrok/ngrok 的原生绑定（platform 包）：.node 无法从 asar 内加载，
  # 且 pnpm 下 optionalDependencies 不会自动进产物，需显式依赖 + 解包
  - node_modules/@ngrok/ngrok-win32-x64-msvc/**/*
afterPack: ./scripts/afterPack.mjs
# 注：打包前的历史产物清理走 npm 脚本 clean:dist-resources（见 package.json 的 build:unpack/build:win 等），
# 不用 beforeBuild 钩子——钩子的输出会被打包日志吞掉，成败不可见。
publish:
  provider: github
  owner: artifyfun
  repo: Comfy-Desktop
artifactName: Artify-${version}-${os}-${arch}.${ext}
win:
  target: nsis
  icon: assets/Comfy_Logo_x256.png
  extraResources:
    # ${arch} expands per target (x64 / arm64), so a native Windows on Arm
    # build ships the win-arm64 bootstrap instead of the x64 one.
    - from: bootstrap-python/win-${arch}
      to: bootstrap-python
      filter:
        - '**/*'
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Disable the built-in unconditional desktop-shortcut creation. The
  # installer surfaces an "Add a desktop shortcut" checkbox on the
  # Finish page (default checked) instead — same default outcome, but
  # the user can opt out. See scripts/installer.nsh → customFinishPage.
  createDesktopShortcut: false
  include: scripts/installer.nsh
mac:
  target:
    - dmg
    - zip
  icon: assets/Comfy_Logo_mac_x1024.png
  category: public.app-category.developer-tools
  extraResources:
    - from: bootstrap-python/mac-arm64
      to: bootstrap-python
      filter:
        - '**/*'
dmg:
  title: Artify
  # background + background@2x live under resources/ (directories.buildResources).
  background: dmg/background.png
  iconSize: 84
  iconTextSize: 11
  window:
    width: 540
    height: 400
  # x/y are icon centers in the 540x400 content area, aligned to the
  # arrow and title drawn into background.png.
  contents:
    - x: 135
      y: 195
      type: file
    - x: 405
      y: 195
      type: link
      path: /Applications
linux:
  target:
    - AppImage
    - deb
  icon: assets/Comfy_Logo_x512.png
  category: Development
  extraResources:
    - from: resources/apparmor-profile
      to: apparmor-profile
    - from: bootstrap-python/linux-x64
      to: bootstrap-python
      filter:
        - '**/*'
deb:
  afterInstall: scripts/after-install.sh
  afterRemove: scripts/after-remove.sh
